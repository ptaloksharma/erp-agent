name: Securi CI
on: [push, pull_request]

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      COSMOS_ENDPOINT: ${{ secrets.COSMOS_ENDPOINT }}
      KEYVAULT_URL: ${{ secrets.KEYVAULT_URL }}
      AZURE_CREDS_JSON: ${{ secrets.AZURE_CREDENTIALS }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dm-agent-kit (Securi CLI)
        run: |
          git clone https://github.com/ptaloksharma/dm-agent-kit.git /tmp/dm-agent-kit
          cd /tmp/dm-agent-kit && npm install && npm run build

      - name: Install agent and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyJWT pydantic structlog cryptography azure-identity azure-cosmos azure-keyvault-secrets pytest pytest-asyncio langgraph faker spacy httpx -r requirements.txt
          python -m spacy download en_core_web_sm
          if [ -f /tmp/dm-agent-kit/requirements.txt ]; then pip install -r /tmp/dm-agent-kit/requirements.txt; fi
          if [ -f /tmp/dm-agent-kit/python/requirements.txt ]; then pip install -r /tmp/dm-agent-kit/python/requirements.txt; fi
          if [ -f /tmp/dm-agent-kit/python/pyproject.toml ] || [ -f /tmp/dm-agent-kit/python/setup.py ]; then pip install -e /tmp/dm-agent-kit/python; fi

      - name: Securi test gate
        run: |
          cd /tmp/dm-agent-kit
          PYTHONPATH=/tmp/dm-agent-kit/python:/tmp/dm-agent-kit/src:/tmp/dm-agent-kit python -m pytest python/tests_securi python/tests -q

      - name: Securi CI gate (BOLA/PII/loop-guard scan)
        run: node /tmp/dm-agent-kit/dist/cli/index.js securi ci-gate --path .

      - name: Log in to Azure
        run: |
          if [ -z "$AZURE_CREDS_JSON" ]; then
            echo "ERROR: AZURE_CREDENTIALS secret is not available."
            exit 1
          fi

          CLIENT_ID=$(echo "$AZURE_CREDS_JSON" | jq -r '.clientId')
          CLIENT_SECRET=$(echo "$AZURE_CREDS_JSON" | jq -r '.clientSecret')
          TENANT_ID=$(echo "$AZURE_CREDS_JSON" | jq -r '.tenantId')
          SUBSCRIPTION_ID=$(echo "$AZURE_CREDS_JSON" | jq -r '.subscriptionId')

          echo "::add-mask::$CLIENT_SECRET"
          echo "AZURE_CLIENT_ID=$CLIENT_ID" >> $GITHUB_ENV
          echo "AZURE_CLIENT_SECRET=$CLIENT_SECRET" >> $GITHUB_ENV
          echo "AZURE_TENANT_ID=$TENANT_ID" >> $GITHUB_ENV
          echo "AZURE_SUBSCRIPTION_ID=$SUBSCRIPTION_ID" >> $GITHUB_ENV

          az login --service-principal -u "$CLIENT_ID" -p "$CLIENT_SECRET" --tenant "$TENANT_ID" > /dev/null
          az account set --subscription "$SUBSCRIPTION_ID"
          echo "Azure Service Principal login successful!"

      - name: Agent self-check
        run: |
          PYTHONPATH=.:/tmp/dm-agent-kit/python:/tmp/dm-agent-kit/src python agent.py

      - name: Verify Azure Cloud Connection
        run: |
          echo "Successfully authenticated with Azure subscription!"
          echo "Cosmos DB Endpoint: $COSMOS_ENDPOINT"
          echo "Key Vault URL: $KEYVAULT_URL"
          az account show